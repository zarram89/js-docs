<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/vite.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Weather App</title>
    <link rel="stylesheet" href="./style.css"/>
</head>
<body>
<div class="weather-widget">
    <div class="search-bar">
        <input type="text" id="search-input" placeholder="Aktobe" />
        <button><span>&#128269;</span></button>
    </div>

    <div class="content">
        <div class="current-weather">
            <div class="temperature" id="temperature">14°</div>
            <div class="weather-icon" id="weather-icon">☁️</div>
            <div class="location" id="city-name">Aktobe</div>
            <button class="favorite" id="add-btn">&#9825;</button>
        </div>

        <div class="added-locations">
            <div class="title">Added Locations:</div>
            <ul id="locations-list"></ul>
        </div>
    </div>
</div>
<script src="./main.js"></script>
</body>
</html>
